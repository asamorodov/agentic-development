<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="800.0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827"><tspan x="800.0" dy="0">Как передавать ADR агенту</tspan></text>
  <text x="800.0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#334155"><tspan x="800.0" dy="0">полная запись остаётся памятью решения, агент получает рабочую проекцию</tspan></text>
  <rect x="70" y="215" width="330" height="420" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="235" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#c2410c"><tspan x="235" dy="0">Полная ADR</tspan></text>
  <text x="235" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="235" dy="0">контекст</tspan></text>
  <text x="235" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="235" dy="0">решение</tspan></text>
  <text x="235" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="235" dy="0">статус</tspan></text>
  <text x="235" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="235" dy="0">последствия</tspan></text>
  <text x="235" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="235" dy="0">confirmation</tspan></text>
  <text x="235" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="235" dy="0">история замены</tspan></text>
  <line x1="420" y1="420" x2="585" y2="420" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="590" y="255" width="420" height="340" rx="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="800" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1d4ed8"><tspan x="800" dy="0">Рабочая проекция</tspan></text>
  <text x="800" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="800" dy="0">краткое правило</tspan></text>
  <text x="800" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="800" dy="0">область действия</tspan></text>
  <text x="800" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="800" dy="0">ссылка на ADR</tspan></text>
  <text x="800" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="800" dy="0">когда остановиться</tspan></text>
  <text x="800" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111827"><tspan x="800" dy="0">какая проверка нужна</tspan></text>
  <line x1="1030" y1="420" x2="1195" y2="420" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1200" y="250" width="330" height="350" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="1365" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#047857"><tspan x="1365" dy="0">Агентская работа</tspan></text>
  <text x="1365" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1365" dy="0">не читает весь архив</tspan></text>
  <text x="1365" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1365" dy="0">применяет действующее правило</tspan></text>
  <text x="1365" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1365" dy="0">не меняет статус ADR</tspan></text>
  <text x="1365" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1365" dy="0">эскалирует развилку</tspan></text>
  <rect x="365" y="710" width="870" height="78" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="754" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="800" dy="0">Проекция помогает агенту действовать по принятому решению, не превращая сокращение в новое правило.</tspan></text>
</svg>