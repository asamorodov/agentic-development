<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="800.0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827"><tspan x="800.0" dy="0">До промпта уже есть изменение</tspan></text>
  <text x="800.0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#334155"><tspan x="800.0" dy="0">разные сигналы сходятся в один рабочий объект</tspan></text>
  <rect x="90" y="220" width="180" height="120" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="180" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8"><tspan x="180" dy="0">bug report</tspan></text>
  <text x="180" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111827"><tspan x="180" dy="0">отчёт об ошибке</tspan></text>
  <line x1="180" y1="350" x2="800" y2="460" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="340" y="220" width="180" height="120" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="430" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8"><tspan x="430" dy="0">review</tspan></text>
  <text x="430" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111827"><tspan x="430" dy="0">комментарий ревью</tspan></text>
  <line x1="430" y1="350" x2="800" y2="460" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="590" y="220" width="180" height="120" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="680" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8"><tspan x="680" dy="0">CI</tspan></text>
  <text x="680" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111827"><tspan x="680" dy="0">сигнал CI</tspan></text>
  <line x1="680" y1="350" x2="800" y2="460" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="840" y="220" width="180" height="120" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="930" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8"><tspan x="930" dy="0">user</tspan></text>
  <text x="930" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111827"><tspan x="930" dy="0">жалоба пользователя</tspan></text>
  <line x1="930" y1="350" x2="800" y2="460" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1090" y="220" width="180" height="120" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1180" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8"><tspan x="1180" dy="0">research.md</tspan></text>
  <text x="1180" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111827"><tspan x="1180" dy="0">исследование</tspan></text>
  <line x1="1180" y1="350" x2="800" y2="460" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1340" y="220" width="180" height="120" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1430" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8"><tspan x="1430" dy="0">ADR</tspan></text>
  <text x="1430" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111827"><tspan x="1430" dy="0">старое решение</tspan></text>
  <line x1="1430" y1="350" x2="800" y2="460" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="560" y="430" width="480" height="150" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="800" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d4ed8"><tspan x="800" dy="0">один объект</tspan><tspan x="800" dy="45">программного изменения</tspan></text>
  <rect x="430" y="650" width="740" height="95" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#111827"><tspan x="800" dy="0">Промпт часто только подключает агента</tspan><tspan x="800" dy="35">к уже начавшемуся изменению</tspan></text>
</svg>