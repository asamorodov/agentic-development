<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="800.0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827"><tspan x="800.0" dy="0">Kiro Specs: состояние фичи как рабочая поверхность</tspan></text>
  
  <rect x="90" y="220" width="360" height="390" rx="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="270" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1d4ed8"><tspan x="270" dy="0">requirements.md</tspan></text>
  <text x="270" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="270" dy="0">user stories</tspan></text>
  <text x="270" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="270" dy="0">acceptance criteria</tspan></text>
  <text x="270" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="270" dy="0">feature / bugfix intent</tspan></text>
  <rect x="620" y="220" width="360" height="390" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="800" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#047857"><tspan x="800" dy="0">design.md</tspan></text>
  <text x="800" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="800" dy="0">technical design</tspan></text>
  <text x="800" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="800" dy="0">affected components</tspan></text>
  <text x="800" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="800" dy="0">risks and decisions</tspan></text>
  <rect x="1150" y="220" width="360" height="390" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="1330" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#c2410c"><tspan x="1330" dy="0">tasks.md</tspan></text>
  <text x="1330" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="1330" dy="0">ordered work</tspan></text>
  <text x="1330" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="1330" dy="0">trackable progress</tspan></text>
  <text x="1330" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="1330" dy="0">agent execution surface</tspan></text>
  <line x1="455" y1="410" x2="615" y2="410" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="985" y1="410" x2="1145" y2="410" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="330" y="710" width="940" height="75" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="754" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="800" dy="0">Kiro Specs удерживают состояние фичи рядом с работой: требования, дизайн и задачи не распадаются на случайный контекст.</tspan></text>
