  <rect x="640" y="405" width="320" height="48" rx="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
  <text x="800" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#111827"><tspan x="800" dy="0">какой tool call</tspan><tspan x="800" dy="25">дал наблюдение</tspan></text>
  <rect x="640" y="473" width="320" height="48" rx="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
  <text x="800" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#111827"><tspan x="800" dy="0">какой diff</tspan><tspan x="800" dy="25">изменил строки</tspan></text>
  <rect x="640" y="541" width="320" height="48" rx="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
