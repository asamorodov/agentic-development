<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="800.0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827"><tspan x="800.0" dy="0">Trace: происхождение изменения за пределами чата</tspan></text>
  
  <rect x="80" y="180" width="340" height="520" rx="20" fill="#f8fbff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="250" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1d4ed8"><tspan x="250" dy="0">Трасса сессии</tspan></text>
  <circle cx="130" cy="277" r="9" fill="#1d4ed8"/>
  <text x="165" y="285" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="165" dy="0">сообщения</tspan></text>
  <circle cx="130" cy="339" r="9" fill="#1d4ed8"/>
  <text x="165" y="347" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="165" dy="0">вызовы инструментов</tspan></text>
  <circle cx="130" cy="401" r="9" fill="#1d4ed8"/>
  <text x="165" y="409" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="165" dy="0">команды и вывод</tspan></text>
  <circle cx="130" cy="463" r="9" fill="#1d4ed8"/>
  <text x="165" y="471" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="165" dy="0">изменённые файлы</tspan></text>
  <circle cx="130" cy="525" r="9" fill="#1d4ed8"/>
  <text x="165" y="533" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="165" dy="0">ошибки и откаты</tspan></text>
  <circle cx="130" cy="587" r="9" fill="#1d4ed8"/>
  <text x="165" y="595" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="165" dy="0">человеческие правки</tspan></text>
  <line x1="430" y1="440" x2="595" y2="440" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="590" y="250" width="420" height="380" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="800" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#c2410c"><tspan x="800" dy="0">связь с происхождением</tspan><tspan x="800" dy="40">изменения</tspan></text>
  <rect x="640" y="337" width="320" height="48" rx="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
