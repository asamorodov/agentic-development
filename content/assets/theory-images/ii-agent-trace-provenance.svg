  <line x1="1020" y1="440" x2="1185" y2="440" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1180" y="190" width="340" height="500" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="1350" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#047857"><tspan x="1350" dy="0">Рабочее состояние</tspan></text>
  <rect x="1235" y="287" width="230" height="44" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="1350" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1350" dy="0">что принято</tspan></text>
  <rect x="1235" y="355" width="230" height="44" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="1350" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1350" dy="0">что проверено</tspan></text>
  <rect x="1235" y="423" width="230" height="44" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="1350" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1350" dy="0">что открыто</tspan></text>
  <rect x="1235" y="491" width="230" height="44" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="1350" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1350" dy="0">кто продолжает</tspan></text>
  <rect x="1235" y="559" width="230" height="44" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="1350" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111827"><tspan x="1350" dy="0">где доказательства</tspan></text>
  <rect x="390" y="760" width="820" height="70" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="803" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#111827"><tspan x="800" dy="0">Trace полезен только тогда, когда его можно связать с кодом, решением и продолжением.</tspan></text>
</svg>